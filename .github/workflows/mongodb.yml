name: MongoDB driver

on:
  push:
    paths:
      - 'server/himongo-jdbc/**'
      - '.github/workflows/mongodb.yml'
  pull_request:
    paths:
      - 'server/himongo-jdbc/**'
      - '.github/workflows/mongodb.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: hi_mongo
          MONGO_INITDB_ROOT_PASSWORD: hi_mongo_dev
        ports:
          - 27017:27017
        options: >-
          --health-cmd 'mongosh --quiet -u hi_mongo -p hi_mongo_dev --authenticationDatabase admin --eval "db.runCommand({ping:1}).ok"'
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/himongo-jdbc/pom.xml
      - name: Verify against MongoDB
        env:
          MONGO_URI: mongodb://hi_mongo:hi_mongo_dev@127.0.0.1:27017/hi_demo?authSource=admin
        run: mvn -B -f server/himongo-jdbc/pom.xml verify -Pintegration
