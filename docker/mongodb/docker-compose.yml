# Local MongoDB for Helical Insight MongoDB datasource demos / IT.
# Credentials are development-only and must not be reused outside local testing.
services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: hi_mongo
      MONGO_INITDB_ROOT_PASSWORD: hi_mongo_dev
      MONGO_INITDB_DATABASE: hi_demo
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - hi_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "hi_mongo", "-p", "hi_mongo_dev", "--authenticationDatabase", "admin", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  hi_mongo_data:
